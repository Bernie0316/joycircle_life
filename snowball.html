<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會滾動的小雪球</title>
    <style>
        /* 背景：深藍色的冬夜 */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-end; /* 讓地面貼在底部 */
        }

        /* 雪地地面 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #eef2f7;
            box-shadow: 0 -5px 20px rgba(255, 255, 255, 0.5);
        }

        /* 雪球本體 */
        .snowball {
            position: absolute;
            bottom: 80px; /* 貼在地面上方（扣除一些視覺重疊） */
            left: -100px; /* 初始位置在畫面左側外面 */
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d2dbe5 70%, #9aaac4 100%);
            border-radius: 50%;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.15), 
                        0 4px 15px rgba(255,255,255,0.4);
            
            /* CSS 動態效果：滾動 (包含移動與旋轉) */
            animation: roll 5s linear infinite;
        }

        /* 雪球內部的紋路（用來讓人看出它真的在「轉動」） */
        .snowball::after {
            content: '❄️';
            font-size: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        /* 定義滾動動畫：向前移動 + 順時針旋轉 */
        @keyframes roll {
            0% {
                left: -80px;
                transform: rotate(0deg);
            }
            100% {
                left: 105vw; /* 滾出右側畫面 */
                transform: rotate(720deg); /* 轉動兩圈 (360 * 2) */
            }
        }
    </style>
</head>
<body>

    <div class="ground"></div>

    <div class="snowball"></div>

</body>
</html>
